<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tank.io</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><div><b>TANK.IO</b><small id="mode">BUILD MODE</small></div><div class="stats"><span>🪙 <i id="coins">0</i></span><span>❤️ <i id="hp">100</i></span></div></header>
