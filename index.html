<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07111c"><title>Tank.io</title><link rel="stylesheet" href="style.css?v=7"></head><body><main>
<header><div class="brand"><b>TANK.IO</b><small id="mode">GARAGE</small></div><div class="stats"><span>🪙 <i id="coins">0</i></span><span>💎 <i id="gems">0</i></span><span>⭐ <i id="level">1</i></span></div></header>
<section class="meters"><div><span>CORE</span><b id="hpText">100/100</b><i><em id="hpBar"></em></i></div><div><span>WAVE</span><b id="wave">0</b></div><div><span>SCORE</span><b id="score">0</b></div></section>

</section>
<footer><button id="clear">RESET BUILD</button><button id="battle">⚔ DEPLOY</button></footer>
</main><script src="game.js?v=7"></script></body></html>
